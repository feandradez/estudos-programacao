<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projeto - To-Do List</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>

    <!--Botão pra alterar o tema.-->
    <button id="tema">🌙</button>

    <!--Div pra centralizar tudo-->
    <div class="container">
        <h1>To-Do List</h1>
        <div class="input-area">
            <input type="text" id="campo">
            <button id="botao">Adicionar</button>
        </div>
        <ul id="lista"></ul>
        
        <!--Contagem das tarefas-->
        <p id="total"></p>
        <p id="concluidas"></p>
        <p id="pendentes"></p>

        <!--Filtros de tarefas-->
        <button id="filtro-todas">Todas</button>
        <button id="filtro-pendentes">Pendentes</button>
        <button id="filtro-concluidas">Concluídas</button>
    </div>

</body>
</html>
